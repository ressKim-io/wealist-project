# =============================================================================
# weAlist Project - Production Environment Override
# =============================================================================
# 프로덕션 환경에 특화된 설정을 오버라이드합니다.
#
# 특징:
# - 최소 포트 노출 (보안)
# - 리소스 제한 (안정성)
# - Read-only 파일시스템 (보안)
# - Health check 강화
# - 로깅 최적화
# - 자동 재시작 정책
#
# 사용법:
#   docker compose -f docker/compose/docker-compose.yml -f docker/compose/docker-compose.prod.yml up -d
# =============================================================================

version: '3.9'

services:
  # ===========================================================================
  # Backend Services - Production Overrides
  # ===========================================================================

  user-service:
    env_file:
      - ../env/.env.prod

    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DEVTOOLS_RESTART_ENABLED=false
      - SPRING_JPA_SHOW_SQL=false
      - SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL=false
      - LOGGING_LEVEL_ROOT=WARN
      - LOGGING_LEVEL_ORG_SPRINGFRAMEWORK=INFO
      - JAVA_OPTS=-Xms512m -Xmx1024m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -XX:+UseG1GC

    # 리소스 제한
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

    # 보안 설정
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    # 프로덕션 Health check 강화
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 120s

    restart: always

  board-service:
    env_file:
      - ../env/.env.prod

    environment:
      - ENV=production
      - LOG_LEVEL=info
      - BOARD_USE_AUTO_MIGRATE=false  # 프로덕션에서는 수동 마이그레이션

    # 리소스 제한
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

    # 보안 설정
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s

    restart: always

  # Frontend - Production with Nginx
  frontend-service:
    env_file:
      - ../env/.env.prod

    ports:
      - "${FRONTEND_HOST_PORT:-80}:80"
      # HTTPS 사용 시
      # - "443:443"

    # 리소스 제한
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

    # Nginx 설정 마운트
    volumes:
      - ../../docker/nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      # SSL 인증서 (필요시)
      # - /etc/letsencrypt:/etc/letsencrypt:ro

    # 보안 설정
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID

    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 30s

    restart: always

  # ===========================================================================
  # Infrastructure Services - Production Overrides
  # ===========================================================================

  postgres:
    env_file:
      - ../env/.env.prod

    # 프로덕션에서는 포트 노출하지 않음 (보안)
    # ports: []

    # 리소스 제한
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

    environment:
      # 프로덕션 보안 설정
      - POSTGRES_HOST_AUTH_METHOD=scram-sha-256

    # 백업 볼륨 마운트 (선택사항)
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../docker/init/postgres/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
      # 백업 디렉토리
      # - /backup/postgres:/backup

    # 보안 설정
    security_opt:
      - no-new-privileges:true

    # 프로덕션 Health check 강화
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER} -d postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    restart: always

    # Sysctl 튜닝 (선택사항, 호스트 권한 필요)
    # sysctls:
    #   - kernel.shmmax=17179869184
    #   - kernel.shmall=4194304

  redis:
    env_file:
      - ../env/.env.prod

    # 프로덕션에서는 포트 노출하지 않음
    # ports: []

    # 리소스 제한
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

    # 프로덕션 Redis 설정 (persistence 활성화)
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --databases 16
      --maxmemory 768mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb

    # 백업 볼륨 (선택사항)
    volumes:
      - redis-data:/data
      # - /backup/redis:/backup

    # 보안 설정
    security_opt:
      - no-new-privileges:true

    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: always

# =============================================================================
# Production Networks
# =============================================================================
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  database-net:
    driver: bridge
    internal: true  # 데이터베이스 네트워크는 외부 접근 차단

# =============================================================================
# Production Volumes
# =============================================================================
volumes:
  postgres-data:
    driver: local
    # 프로덕션에서는 외부 볼륨 사용 권장
    # driver_opts:
    #   type: nfs
    #   o: addr=nfs-server,rw
    #   device: ":/path/to/postgres"

  redis-data:
    driver: local
