name: CD - Dev User Service

on:
  # 1. CI 완료 후 자동 실행 (workflow_run)
  workflow_run:
    workflows: ["CI - Dev User Service"]
    types:
      - completed
    # branches 필터 제거 - job level에서 브랜치 체크

  # 2. 인프라 변경 시 직접 실행
  push:
    branches:
      - deploy-dev
    paths:
      - "docker/compose/docker-compose.ec2-dev.yml"
      - ".github/workflows/cd-dev-user-service.yml"

  # 3. 수동 실행 (강제 재배포)
  workflow_dispatch:
    inputs:
      reason:
        description: "배포 사유 (선택)"
        required: false
        type: string

# env section removed - values loaded from Parameter Store in steps

jobs:
  deploy:
    name: Deploy to EC2 via SSM
    runs-on: ubuntu-latest
    environment: development
    # workflow_run으로 트리거된 경우, CI가 성공했고 deploy-dev 브랜치일 때만 실행
    if: |
      github.event_name == 'push' || 
      github.event_name == 'workflow_dispatch' || 
      (github.event_name == 'workflow_run' && 
       github.event.workflow_run.conclusion == 'success' && 
       github.event.workflow_run.head_branch == 'deploy-dev')

    steps:
      # ============================================
      # 0. 워크플로우 트리거 정보 출력 (디버깅)
      # ============================================
      - name: 🔍 Debug Workflow Trigger
        run: |
          echo "=== Workflow Trigger Information ==="
          echo "Event Name: ${{ github.event_name }}"
          echo "Repository: ${{ github.repository }}"
          echo "Ref: ${{ github.ref }}"
          echo "SHA: ${{ github.sha }}"
          
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo ""
            echo "=== Workflow Run Details ==="
            echo "Triggering Workflow: ${{ github.event.workflow_run.name }}"
            echo "Triggering Workflow ID: ${{ github.event.workflow_run.id }}"
            echo "Conclusion: ${{ github.event.workflow_run.conclusion }}"
            echo "Head Branch: ${{ github.event.workflow_run.head_branch }}"
            echo "Head SHA: ${{ github.event.workflow_run.head_sha }}"
            echo "Event: ${{ github.event.workflow_run.event }}"
          fi
          
          echo ""
          echo "=== Job Condition Check ==="
          echo "Should run: true (this job is running)"
      # ============================================
      # 1. 코드 체크아웃
      # ============================================
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          # workflow_run 이벤트의 경우 트리거한 워크플로우의 SHA 사용
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      # ============================================
      # 2. AWS Credentials 설정
      # ============================================
      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.WEALIST_DEV_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.WEALIST_DEV_AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # ============================================
      # 3. Parameter Store에서 설정 로드
      # ============================================
      - name: 📥 Load Configuration from Parameter Store
        id: config
        run: |
          echo "📥 Loading CD configuration from Parameter Store..."
          
          # CD 관련 파라미터 로드
          AWS_REGION=$(aws ssm get-parameter \
            --name "/wealist/dev/cd/aws_region" \
            --query 'Parameter.Value' \
            --output text)
          
          PARAMETER_PREFIX=$(aws ssm get-parameter \
            --name "/wealist/dev/cd/parameter_prefix" \
            --query 'Parameter.Value' \
            --output text)
          
          COMPOSE_FILE_PATH=$(aws ssm get-parameter \
            --name "/wealist/dev/cd/compose_file_path" \
            --query 'Parameter.Value' \
            --output text)
          
          EC2_INSTANCE_ID=$(aws ssm get-parameter \
            --name "/wealist/dev/cd/ec2_instance_id" \
            --query 'Parameter.Value' \
            --output text)
          
          # 출력 변수로 설정
          echo "aws-region=${AWS_REGION}" >> $GITHUB_OUTPUT
          echo "parameter-prefix=${PARAMETER_PREFIX}" >> $GITHUB_OUTPUT
          echo "compose-file-path=${COMPOSE_FILE_PATH}" >> $GITHUB_OUTPUT
          echo "ec2-instance-id=${EC2_INSTANCE_ID}" >> $GITHUB_OUTPUT
          
          echo "✅ Configuration loaded successfully"
          echo "  - AWS Region: ${AWS_REGION}"
          echo "  - Parameter Prefix: ${PARAMETER_PREFIX}"
          echo "  - Compose File Path: ${COMPOSE_FILE_PATH}"
          echo "  - EC2 Instance ID: ${EC2_INSTANCE_ID}"

      # ============================================
      # 4. ECR 로그인
      # ============================================
      - name: 🔑 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ============================================
      # 5. docker-compose 파일을 EC2에 복사
      # ============================================
      - name: 📦 Upload docker-compose file to EC2
        run: |
          echo "📦 Uploading docker-compose file to EC2..."

          # docker-compose 파일을 Base64로 인코딩
          COMPOSE_CONTENT=$(base64 -w 0 docker/compose/docker-compose.ec2-dev.yml)

          # SSM으로 파일 전송
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.config.outputs.ec2-instance-id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Upload docker-compose file - ${{ github.sha }}" \
            --timeout-seconds 60 \
            --parameters commands="[
              \"echo 'Uploading docker-compose file...'\",
              \"mkdir -p /home/ubuntu/wealist/docker/compose\",
              \"echo '${COMPOSE_CONTENT}' | base64 -d > /home/ubuntu/wealist/docker/compose/docker-compose.ec2-dev.yml\",
              \"chown ubuntu:ubuntu /home/ubuntu/wealist/docker/compose/docker-compose.ec2-dev.yml\",
              \"echo '✅ docker-compose file uploaded successfully'\",
              \"ls -lh /home/ubuntu/wealist/docker/compose/docker-compose.ec2-dev.yml\"
            ]" \
            --output text \
            --query "Command.CommandId")

          echo "⏳ Waiting for file upload..."
          aws ssm wait command-executed \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ steps.config.outputs.ec2-instance-id }}"

          echo "✅ docker-compose file uploaded"

      # ============================================
      # 6. SSM Run Command로 배포 실행
      # ============================================
      - name: 🚀 Deploy via SSM Run Command
        id: deploy
        run: |
          echo "📋 Deployment Configuration:"
          echo "  - Instance ID: ${{ steps.config.outputs.ec2-instance-id }}"
          echo "  - AWS Region: ${{ steps.config.outputs.aws-region }}"
          echo "  - Commit SHA: ${{ github.sha }}"
          echo ""

          # 배포 스크립트를 heredoc으로 생성
          cat > /tmp/deploy-user.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail

          echo "🚀 User Service Deployment Started"

          # 환경 변수 로드
          export AWS_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          export AWS_REGION=ap-northeast-2
          export PARAMETER_PREFIX=/wealist/dev

          load_param() {
            local param_name="$1"
            aws ssm get-parameter --name "${PARAMETER_PREFIX}/${param_name}" --query 'Parameter.Value' --output text --region "${AWS_REGION}"
          }

          load_secret() {
            local param_name="$1"
            aws ssm get-parameter --name "${PARAMETER_PREFIX}/${param_name}" --with-decryption --query 'Parameter.Value' --output text --region "${AWS_REGION}"
          }
          # ===============================================
          # 1. 시크릿 및 DB 환경 변수 로드 (기존 로직)
          # ===============================================
          # 환경 변수 로드
          export POSTGRES_SUPERUSER=$(load_param "db/postgres_superuser")
          export POSTGRES_SUPERUSER_PASSWORD=$(load_secret "db/postgres_superuser_password")
          export USER_DB_NAME=$(load_param "db/user_db_name")
          export USER_DB_USER=$(load_param "db/user_db_user")
          export USER_DB_PASSWORD=$(load_secret "db/user_db_password")
          export BOARD_DB_NAME=$(load_param "db/board_db_name")
          export BOARD_DB_USER=$(load_param "db/board_db_user")
          export BOARD_DB_PASSWORD=$(load_secret "db/board_db_password")
          export REDIS_PASSWORD=$(load_secret "cache/redis_password")
          export JWT_SECRET=$(load_secret "jwt/jwt_secret")
          export GOOGLE_CLIENT_ID=$(load_secret "oauth/google_client_id")
          export GOOGLE_CLIENT_SECRET=$(load_secret "oauth/google-client-secret")
          export GRAFANA_ADMIN_USER=$(load_param "monitor/grafana_admin_user")
          export GRAFANA_ADMIN_PASSWORD=$(load_secret "monitor/grafana_admin_password")

          # ===============================================
          # 2. 🚨 OAuth/URL 환경 변수 추가 (새로운 로직)
          # ===============================================
          # Spring Security Client Redirect Base URL (예: https://api.wealist.co.kr)
          export OAUTH2_CLIENT_REDIRECT_BASE=$(load_param "url/oauth2_client_redirect_base")
          if [ -z "$OAUTH2_CLIENT_REDIRECT_BASE" ]; then
            echo "❌ ERROR: Parameter 'url/oauth2_client_redirect_base' not found in Parameter Store"
            echo "Please set the parameter using:"
            echo "  aws ssm put-parameter --name '/wealist/dev/url/oauth2_client_redirect_base' --value 'https://api.wealist.co.kr' --type String"
            exit 1
          fi
          
          # OAuth Success Handler 최종 Redirect URL (예: https://wealist.co.kr/oauth/callback)
          export OAUTH2_REDIRECT_URL_ENV=$(load_param "url/oauth2_redirect_url")
          if [ -z "$OAUTH2_REDIRECT_URL_ENV" ]; then
            echo "❌ ERROR: Parameter 'url/oauth2_redirect_url' not found in Parameter Store"
            echo "Please set the parameter using:"
            echo "  aws ssm put-parameter --name '/wealist/dev/url/oauth2_redirect_url' --value 'https://wealist.co.kr/oauth/callback' --type String"
            exit 1
          fi
          
          # OAuth Client Redirect URI (Spring Security에서 사용)
          export OAUTH2_CLIENT_REDIRECT_URI="${OAUTH2_CLIENT_REDIRECT_BASE}/api/users/login/oauth2/code/google"
          export SPRING_PROFILES_ACTIVE="aws" # AWS 프로파일 활성화

          # S3 Configuration
          export S3_BUCKET=$(load_param "s3/bucket")
          export S3_REGION=$(load_param "s3/region")
          export S3_ACCESS_KEY=$(load_secret "s3/access-key")
          export S3_SECRET_KEY=$(load_secret "s3/secret-key")

          echo "✅ Parameters loaded, Profiles set to aws"
          echo "   - OAUTH2_CLIENT_REDIRECT_BASE=${OAUTH2_CLIENT_REDIRECT_BASE}"
          echo "   - OAUTH2_REDIRECT_URL_ENV=${OAUTH2_REDIRECT_URL_ENV}"
          echo "   - OAUTH2_CLIENT_REDIRECT_URI=${OAUTH2_CLIENT_REDIRECT_URI}"
          echo "   - S3_BUCKET=${S3_BUCKET}"
          echo "   - S3_REGION=${S3_REGION}"


          # ECR 로그인
          aws ecr get-login-password --region ${AWS_REGION} | docker login --username AWS --password-stdin ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com

          # 이미지 Pull
          docker pull ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/wealist-dev-user-service:latest

          # Docker Compose 명령어 결정
          if docker compose version &> /dev/null; then
            COMPOSE_CMD="docker compose"
          else
            COMPOSE_CMD="docker-compose"
          fi

          # 컨테이너 재시작
          COMPOSE_FILE=/home/ubuntu/wealist/docker/compose/docker-compose.ec2-dev.yml
          $COMPOSE_CMD -f ${COMPOSE_FILE} up -d --force-recreate user-service

          # Health Check (context path 적용)
          echo "🏥 Health check..."
          sleep 15
          for i in {1..15}; do
            if curl -f http://localhost:8080/api/users/actuator/health > /dev/null 2>&1; then
              echo "✅ User service is healthy!"
              docker image prune -f
              exit 0
            fi
            echo "⏳ Waiting... ($i/15)"
            sleep 5
          done

          echo "❌ Health check failed!"
          $COMPOSE_CMD -f ${COMPOSE_FILE} logs --tail=50 user-service
          exit 1
          EOF

          chmod +x /tmp/deploy-user.sh

          # 스크립트를 Base64로 인코딩 (특수문자 안전하게 전송)
          echo "📦 Encoding deployment script..."
          SCRIPT_BASE64=$(base64 -w 0 /tmp/deploy-user.sh)
          echo "✅ Script encoded (${#SCRIPT_BASE64} bytes)"
          echo ""

          # SSM Run Command 실행
          echo "🚀 Sending command to EC2 instance..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.config.outputs.ec2-instance-id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy User Service - ${{ github.sha }}" \
            --timeout-seconds 300 \
            --parameters commands="[
              \"echo '=== Deployment Script Received ===' \",
              \"echo 'Timestamp: '\$(date) \",
              \"echo 'Instance ID: '\$(ec2-metadata --instance-id 2>/dev/null || echo 'N/A') \",
              \"echo '' \",
              \"echo '${SCRIPT_BASE64}' | base64 -d > /tmp/deploy.sh\",
              \"chmod +x /tmp/deploy.sh\",
              \"echo '🚀 Starting deployment script execution...' \",
              \"export PARAMETER_PREFIX='${{ steps.config.outputs.parameter-prefix }}'\",
              \"export AWS_REGION='${{ steps.config.outputs.aws-region }}'\",
              \"export COMPOSE_FILE='${{ steps.config.outputs.compose-file-path }}'\",
              \"/tmp/deploy.sh 2>&1 | tee /tmp/deploy.log\",
              \"DEPLOY_EXIT_CODE=\${PIPESTATUS[0]}\",
              \"echo '' \",
              \"echo '=== Deployment Script Finished ===' \",
              \"echo 'Exit Code: '\$DEPLOY_EXIT_CODE \",
              \"rm -f /tmp/deploy.sh\",
              \"exit \$DEPLOY_EXIT_CODE\"
            ]" \
            --output text \
            --query "Command.CommandId")

          if [ -z "$COMMAND_ID" ]; then
            echo "❌ Failed to send SSM command - no Command ID returned"
            exit 1
          fi

          echo "command-id=${COMMAND_ID}" >> $GITHUB_OUTPUT
          echo "✅ Command sent successfully"
          echo "📝 Command ID: ${COMMAND_ID}"
          echo ""

      # ============================================
      # 7. 배포 결과 대기
      # ============================================
      - name: ⏳ Wait for Deployment
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command-id }}"
          INSTANCE_ID="${{ steps.config.outputs.ec2-instance-id }}"

          echo "⏳ Waiting for deployment to complete..."
          echo "  - Command ID: ${COMMAND_ID}"
          echo "  - Instance ID: ${INSTANCE_ID}"
          echo ""

          # 명령어 실행 대기 (최대 5분)
          echo "⏳ Polling command status..."
          MAX_WAIT=60  # 5분 (5초 간격)
          WAIT_COUNT=0
          LAST_OUTPUT_LINE=""

          while [ $WAIT_COUNT -lt $MAX_WAIT ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")
            
            # 30초마다 현재 출력 확인 (진행 상황 표시)
            if [ $((WAIT_COUNT % 6)) -eq 0 ]; then
              CURRENT_OUTPUT=$(aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${INSTANCE_ID}" \
                --query "StandardOutputContent" \
                --output text 2>/dev/null | tail -1)
              
              if [ "$CURRENT_OUTPUT" != "$LAST_OUTPUT_LINE" ] && [ -n "$CURRENT_OUTPUT" ]; then
                echo "  [$((WAIT_COUNT * 5))s] Status: ${STATUS} | Last output: ${CURRENT_OUTPUT}"
                LAST_OUTPUT_LINE="$CURRENT_OUTPUT"
              else
                echo "  [$((WAIT_COUNT * 5))s] Status: ${STATUS}"
              fi
            fi
            
            if [ "$STATUS" = "Success" ] || [ "$STATUS" = "Failed" ] || [ "$STATUS" = "TimedOut" ] || [ "$STATUS" = "Cancelled" ]; then
              break
            fi
            
            sleep 5
            WAIT_COUNT=$((WAIT_COUNT + 1))
          done

          # 타임아웃 체크
          if [ $WAIT_COUNT -ge $MAX_WAIT ]; then
            echo ""
            echo "⚠️  Polling timeout reached (5 minutes)"
            echo "   Command may still be running on EC2"
            echo "   Check SSM command status manually:"
            echo "   aws ssm get-command-invocation --command-id ${COMMAND_ID} --instance-id ${INSTANCE_ID}"
          fi

          echo ""
          echo "📊 Final Status: ${STATUS}"
          echo ""

          if [ "$STATUS" != "Success" ]; then
            echo "❌ Deployment failed with status: ${STATUS}"
            echo ""
            echo "📋 Error Output:"
            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "StandardErrorContent" \
              --output text
            echo ""
            echo "📋 Standard Output:"
            aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${INSTANCE_ID}" \
              --query "StandardOutputContent" \
              --output text
            exit 1
          fi

          echo "✅ Deployment completed successfully!"

      # ============================================
      # 8. 배포 로그 출력
      # ============================================
      - name: 📋 Show Deployment Logs
        if: always()
        run: |
          echo "📋 Full Deployment Output:"
          echo "================================"
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command-id }}" \
            --instance-id "${{ steps.config.outputs.ec2-instance-id }}" \
            --query "StandardOutputContent" \
            --output text || echo "⚠️  Could not retrieve output"
          echo ""
          echo "================================"

      # ============================================
      # 9. Summary
      # ============================================
      - name: 📊 Deployment Summary
        if: always()
        run: |
          STATUS="${{ job.status }}"

          if [ "$STATUS" = "success" ]; then
            ICON="✅"
            TITLE="User Service Deployed Successfully"
          else
            ICON="❌"
            TITLE="User Service Deployment Failed"
          fi

          cat >> $GITHUB_STEP_SUMMARY << EOF
          ### ${ICON} ${TITLE}

          - **Commit:** \`${{ github.sha }}\`
          - **Instance:** \`${{ steps.config.outputs.ec2-instance-id }}\`
          - **Command ID:** \`${{ steps.deploy.outputs.command-id }}\`
          - **Status:** ${STATUS}
          - **Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')

          #### Quick Links
          - [View Commit](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
          - [Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF
